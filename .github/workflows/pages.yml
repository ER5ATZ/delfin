name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Build application
        run: ./mvnw package -DskipTests -q

      - name: Start application and extract OpenAPI spec
        run: |
          java -jar target/delfin-1.0-SNAPSHOT.jar &
          APP_PID=$!
          
          # Wait for app to be ready (max 60 seconds)
          for i in $(seq 1 60); do
            if curl -f -s http://localhost:8080/v3/api-docs > /dev/null 2>&1; then
              echo "App ready after ${i}s"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "App failed to start within 60s"
              kill $APP_PID 2>/dev/null
              exit 1
            fi
            sleep 1
          done
          
          # Extract OpenAPI spec
          curl -f -s http://localhost:8080/v3/api-docs > docs/openapi.json
          echo "OpenAPI spec generated successfully"
          
          # Stop app
          kill $APP_PID 2>/dev/null

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
