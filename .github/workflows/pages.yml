name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Start Spring Boot app in background
        run: |
          ./mvnw spring-boot:run &
          sleep 10

      - name: Generate OpenAPI spec
        run: |
          if curl -f -s http://localhost:8080/v3/api-docs > docs/openapi.json; then
            echo "OpenAPI spec generated successfully"
          else
            echo "Failed to generate OpenAPI spec"
            exit 1
          fi

      - name: Stop Spring Boot app
        run: pkill -f "spring-boot:run"
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
